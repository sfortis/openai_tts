name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest_version=$(jq -r '.version' custom_components/openai_tts/manifest.json)
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag $tag does not match manifest.json version ($manifest_version)"
            exit 1
          fi
          if [[ "$version" == *b* || "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Build release zip
        # HACS counts downloads only when the integration is delivered as
        # a release asset (matching ``filename`` in ``hacs.json``).
        # The zip mirrors the layout HACS expects: integration files at
        # the root, so HACS can extract straight into
        # ``<config>/custom_components/openai_tts/``.
        run: |
          cd custom_components/openai_tts
          zip -r "${{ github.workspace }}/openai_tts.zip" . \
            -x '*.pyc' '__pycache__/*' '.DS_Store'
          ls -la "${{ github.workspace }}/openai_tts.zip"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--title "v${{ steps.version.outputs.version }}")
          # Prefer WHATSNEW.md when present so the description reads as
          # human-curated release notes; fall back to GitHub's auto
          # commit-based notes otherwise.
          if [ -f WHATSNEW.md ]; then
            flags+=(--notes-file WHATSNEW.md)
          else
            flags+=(--generate-notes)
          fi
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ github.workspace }}/openai_tts.zip" \
            "${flags[@]}"
