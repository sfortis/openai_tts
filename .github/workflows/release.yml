name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest_version=$(jq -r '.version' custom_components/openai_tts/manifest.json)
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag $tag does not match manifest.json version ($manifest_version)"
            exit 1
          fi
          if [[ "$version" == *b* || "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Check release notes
        # WHATSNEW.md holds the notes of the current release only, and
        # the whole file becomes the release description. Refuse a file
        # that still carries an older section or lacks this version.
        run: |
          expected="## v${{ steps.version.outputs.version }}"
          if [ ! -f WHATSNEW.md ]; then
            echo "::error::WHATSNEW.md is missing"
            exit 1
          fi
          headings=$(grep '^## ' WHATSNEW.md || true)
          if [ "$headings" != "$expected" ]; then
            echo "::error::WHATSNEW.md must contain exactly one section, '$expected'. Found:"
            echo "$headings"
            exit 1
          fi

      - name: Build release zip
        # HACS counts downloads only when the integration is delivered as
        # a release asset (matching ``filename`` in ``hacs.json``).
        # The zip mirrors the layout HACS expects: integration files at
        # the root, so HACS can extract straight into
        # ``<config>/custom_components/openai_tts/``.
        #
        # Markdown is excluded. The working copy of this folder carries
        # development notes that .gitignore keeps out of the repository
        # but that the zip would otherwise pick up, since it is built
        # from the folder rather than from git. No module reads any
        # markdown at runtime, so nothing is lost.
        run: |
          cd custom_components/openai_tts
          zip -r "${{ github.workspace }}/openai_tts.zip" . \
            -x '*.pyc' '__pycache__/*' '.DS_Store' '*.md'
          echo "--- shipped contents ---"
          unzip -l "${{ github.workspace }}/openai_tts.zip"
          if unzip -l "${{ github.workspace }}/openai_tts.zip" | grep -qiE '\.md$'; then
            echo "::error::markdown leaked into the release zip"
            exit 1
          fi

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--title "v${{ steps.version.outputs.version }}" --notes-file WHATSNEW.md)
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" \
            "${{ github.workspace }}/openai_tts.zip" \
            "${flags[@]}"
