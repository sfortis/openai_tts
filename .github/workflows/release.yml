name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  release:
    name: Create GitHub release
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Resolve version
        id: version
        run: |
          tag="${GITHUB_REF_NAME}"
          version="${tag#v}"
          manifest_version=$(jq -r '.version' custom_components/openai_tts/manifest.json)
          if [ "$version" != "$manifest_version" ]; then
            echo "::error::Tag $tag does not match manifest.json version ($manifest_version)"
            exit 1
          fi
          if [[ "$version" == *b* || "$version" == *-* ]]; then
            prerelease=true
          else
            prerelease=false
          fi
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - name: Create release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          flags=(--generate-notes --title "v${{ steps.version.outputs.version }}")
          if [ "${{ steps.version.outputs.prerelease }}" = "true" ]; then
            flags+=(--prerelease)
          fi
          gh release create "${{ steps.version.outputs.tag }}" "${flags[@]}"
