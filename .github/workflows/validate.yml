name: Validate

on:
  push:
  pull_request:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Install ruff
        # Pinned on purpose. Ruff adds checks to existing rule families
        # between releases, so an unpinned install can turn this job red
        # without a single line changing here. Bump it deliberately, and
        # keep it in step with what developers run locally.
        run: pip install ruff==0.14.14
      - name: Ruff
        run: ruff check --output-format=github .

  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      # Pinned for the same reason ruff is: a new pytest release should
      # not turn this job red on its own.
      - name: Install pytest
        run: pip install pytest==9.0.2
      - name: Tests
        run: pytest -q

  validate-hacs:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: HACS Action
        uses: hacs/action@main
        with:
          category: integration

  validate-hassfest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Hassfest
        uses: home-assistant/actions/hassfest@master
