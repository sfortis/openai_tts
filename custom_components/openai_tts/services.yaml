# Structure only. Every piece of prose (the action name, the field names
# and descriptions, and the voice labels) lives in strings.json so it can
# be translated; Home Assistant matches it up by key.
say:
  target:
    entity:
      domain: media_player
  fields:
    # Core Settings
    tts_entity:
      required: true
      example: "tts.openai_tts_tts_1"
      selector:
        entity:
          domain: tts
          integration: openai_tts
    message:
      required: true
      example: "Hello, this is a test message."
      selector:
        text:

    # Voice Settings
    voice:
      required: false
      selector:
        select:
          custom_value: true
          translation_key: voice
          options:
            - alloy
            - ash
            - ballad
            - cedar
            - coral
            - echo
            - fable
            - marin
            - nova
            - onyx
            - sage
            - shimmer
            - verse
    speed:
      required: false
      example: 1.0
      selector:
        number:
          min: 0.25
          max: 4.0
          step: 0.05
          mode: slider
    instructions:
      required: false
      example: "Speak with enthusiasm"
      selector:
        text:
          multiline: true
    extra_payload:
      required: false
      example: '{"temperature": 0.7}'
      selector:
        text:
          multiline: true
    language:
      required: false
      default: "en"
      example: "en"
      selector:
        text:

    # Audio Processing
    # NOTE: chime / normalize_audio / pause_playback intentionally do
    # NOT set ``default:`` here. The HA UI would otherwise inject
    # those defaults into the service call payload, and our handler
    # treats any present key as an explicit override of the profile
    # config - which silently shadowed profile-level chime/normalize
    # settings. Leaving these unset means an omitted field stays
    # omitted, which is what we want.
    chime:
      required: false
      selector:
        boolean:
    chime_sound:
      required: false
      example: "threetone.mp3"
      selector:
        text:
    normalize_audio:
      required: false
      selector:
        boolean:

    # Playback Control
    volume:
      required: false
      selector:
        number:
          min: 0.0
          max: 1.0
          step: 0.05
          mode: slider
    announce:
      required: false
      selector:
        boolean:
    # NOTE: ``pause_playback`` remains accepted by the service handler
    # as a legacy alias for ``announce`` so existing automations keep
    # working untouched. It's intentionally not surfaced in the UI -
    # advertising both fields confused users (issue #N: "why do I
    # see two toggles that mean the same thing?").
